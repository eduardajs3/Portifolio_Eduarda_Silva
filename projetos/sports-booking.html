  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></symbol>
    </svg>

    <div class="notfound" id="notFound" hidden>
      <div class="notfound-box">
        <h1>404</h1>
        <h2>Projeto não encontrado</h2>
        <p class="muted">O projeto que você procura não existe ou foi movido.</p>
        <div class="notfound-action"><a class="btn-primary" href="index.html">Voltar ao portfólio</a></div>
      </div>
    </div>

    <div id="projeto" hidden>
      <header class="site-header">
        <div class="wrap wrap-narrow">
          <a class="back-link" href="index.html"><svg class="icon"><use href="#i-arrow-left" /></svg> Voltar ao portfólio</a>
          <a class="btn-outline" href="#repositorio"><svg class="icon"><use href="#i-github" /></svg> Código</a>
        </div>
      </header>
      <section class="project-hero grain-glow">
        <div class="wrap wrap-narrow">
          <p class="eyebrow" data-semestre></p>
          <h1 data-nome></h1>
          <p class="resumo" data-resumo></p>
          <div class="chips" data-tecnologias></div>
        </div>
      </section>
      <div class="project-main">
        <div class="surface-card gallery" id="gallery" hidden>
          <div class="gallery-track" id="track"></div>
          <div id="galleryControls" hidden>
            <button class="gallery-nav prev" id="prev" aria-label="Foto anterior"><svg class="icon icon-lg"><use href="#i-chevron-left" /></svg></button>
            <button class="gallery-nav next" id="next" aria-label="Próxima foto"><svg class="icon icon-lg"><use href="#i-chevron-right" /></svg></button>
            <div class="gallery-dots" id="dots"></div>
            <span class="slide-page" id="counter"></span>
          </div>
        </div>
        <div class="detail-grid">
          <article>
            <div><h2>Sobre o projeto</h2><p data-descricao></p></div>
            <div><h2>Minha participação</h2><p data-participacao></p><div class="chips" data-minhas-tecnologias></div></div>
          </article>
          <aside class="surface-card aside" id="repositorio">
            <p class="eyebrow">Repositório</p>
            <p class="muted aside-text">Código-fonte do projeto disponível no GitHub.</p>
            <a class="btn-primary" data-repo-front href="#" target="_blank" rel="noreferrer">Front-end <svg class="icon"><use href="#i-arrow-up-right" /></svg></a>
            <a class="btn-primary" data-repo-back href="#" target="_blank" rel="noreferrer">Back-end <svg class="icon"><use href="#i-arrow-up-right" /></svg></a>
          </aside>
        </div>
        <div class="others"><p class="eyebrow">Outros projetos</p><div class="others-list" id="outrosProjetos"></div></div>
      </div>
    </div>

    <template id="tpl-chip"><span class="chip"></span></template>
    <template id="tpl-slide"><div class="gallery-slide"><img alt="" /></div></template>
    <template id="tpl-dot"><button type="button"></button></template>
    <template id="tpl-outro"><a></a></template>
    <script src="js/data.js"></script>
    <script src="js/projeto.js"></script>
  </body>
</html>
